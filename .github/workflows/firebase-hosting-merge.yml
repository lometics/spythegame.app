# The site itself is hosted on Vercel (Git integration, see vercel.json).
# This workflow checks the build and deploys only the Realtime Database rules.
name: Check and deploy Firebase rules on main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check_and_deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Type check + build only; Vercel builds the deployed copy with its own env vars.
      - name: Build
        run: npm run build

      - name: Write service account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPY_THE_GAME_WALSER }}
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa-key.json" >> "$GITHUB_ENV"

      - name: Deploy database rules
        run: npx firebase-tools deploy --only database --project spy-the-game-walser --non-interactive
